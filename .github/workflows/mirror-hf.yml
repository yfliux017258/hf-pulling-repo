name: Download Dataset from Hugging Face

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
    inputs:
      dataset:
        description: "HF dataset id (org/name)"
        required: true
      revision:
        description: "branch / tag / commit"
        default: "main"

permissions:
  contents: write

jobs:
  download-dataset:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install Hugging Face Hub (and Git LFS if needed)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      # Step 4: Download the dataset
      # Replace 'username/dataset_name' with your target dataset
      - name: Download Hugging Face Dataset
        env:
          # Optional: Use if the dataset is private or gated
          HF_TOKEN: ${{ secrets.HF_TOKEN }} 
          DATASET: ${{ inputs.dataset }} 
        run: |
          hf download "$DATASET" --repo-type dataset --local-dir data/
          rm -rf data/.cache

      # Step 5: Commit and push the downloaded dataset to the repo
      - name: Commit and push changes
        env:
          DATASET: ${{ inputs.dataset }} 
          REVISION: $${{ inputs.revision }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Mirror $DATASET@$REVISION" || echo "No changes"
          git push
